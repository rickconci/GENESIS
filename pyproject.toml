# GENESIS: the release's environment. `uv sync` redraws the figures; `uv sync --extra model` adds what
# training, scoring and the scores-to-tables extracts import (CUDA 12.8 torch).
# Versions are exact: the figure check compares pixels, and matplotlib's text rendering moves between releases.

[project]
name = "genesis"
version = "1.0.0"
description = "GENESIS: a conditional generative model of single-cell perturbation responses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.10.7",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pyarrow==22.0.0",
    "scipy==1.15.3",
]

[project.optional-dependencies]
model = [
    "anndata==0.11.4",
    "gseapy==1.2.1",          # the Hallmark GSEA producer (src/eval/readout/gsea_prerank.py)
    "h5py==3.15.1",
    "joblib==1.5.2",
    "omegaconf==2.3.0",
    "pytorch-lightning==2.6.0",
    "pyyaml==6.0.3",
    "scdataset==0.3.0",
    "scikit-learn==1.7.2",
    "seaborn==0.13.2",
    "torch==2.7.1+cu128",
    "tqdm==4.67.1",
    "wandb==0.20.0",          # the published configs log to W&B; pass use_wandb=false to train without it
]

[tool.uv]
package = false               # run from the repository root: python -m scripts.figures.draw_all

# Every package, transitive ones too, at the version the published work ran with (the scfm_meta
# environment); without these, uv would pick newer releases of the transitive dependencies.
constraint-dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.2",
    "aiosignal==1.4.0",
    "anndata==0.11.4",
