# Arms registry: every bar in a published metric-bar panel, and where its scores live.
#
#   arms:   id -> name (default bar label), color (palette key in src/eval/plots/style.py),
#           path (metrics_summary.json, repo-relative)
#   panels: name -> bars / references (arm ids, or {arm, name, color} to relabel),
#           the split-half reference (ceiling_split, or a pinned ceiling_json), the
#           output figure, and its layout options
#
# Read by src/eval/results.py (load_panels) and scripts/figures/figure2/extract/extract.py (arm names and order).
# A bar arm whose file is missing is fatal: a panel one arm short still looks publishable.
# How each arm is scored is not recorded here: the level-3 drivers (scripts/figures/figureN/score/<panel>/score.sh)
# are the record of every published arm's arguments.
#
# DEG keys: every arm must sit on the same DEG floor (`..._detfloor10`). An arm on another
# floor shares no DEG key, and the per-metric intersection then drops to n=0.

