# =============================================================================
# Loss ablation, set-level: an RBF kernel score in place of the energy score, computed set against set. Each step: 7 conditions, each with up to 256 of its real cells
# against 256 generated, the unbiased masked RBF kernel score weighted by each condition's
# training-cell budget (src/model/losses.py:grouped_rbf_kernel_score).
#
# The 25%-cells budget holds: cell_set_budget_from_train_indices restricts every unit to a fixed,
# seeded subset of exactly its count in the split's train rows (units with none are dropped);
# <run>/cell_set_budget.parquet records it. 61,251 units -> 8,750 steps per epoch at C = 7.
#
# Diff against the per-cell RBF arm, and why:
#   train_loader_mode cell_set, group_by_condition true      the set-level estimator
#   cell_set_budget_from_train_indices true, use_cell_set 256, cell_set_min_cells 1
#   batch_size 7 (conditions), schedule {n_repeats 256, batch_size 7}; target product 1792
#   max_epochs 32, LR drops at epochs 6 and 13              280,000 steps (+0.67% on 278,140);
#                                                           drops at 18.8% / 40.6% (partner 20 / 40)
#   rbf_bandwidth_median 13.427872657775879                 the per-cell arm's own (rbf_bandwidth.json)
#   checkpoint_data_fraction 1.0, eval_callback_every_n_epochs 2   ~the partner's counts
#   run_name_suffix
# Generated cells per step: 1,792 (partner 458,752). Head-bias warmstart: unweighted cell-set scan.
#
# GPU=N bash configs/tahoe/bio/ablation/mmd_loss/launch_set.sh
# =============================================================================

run_name_suffix: h4096x8192_rbfset_c7x256_32ep_state2k_tahoe_bio_25cell_seed0

dataset: tahoe
hvg_genes_path: core_util_data/tahoe/gene_subsets/STATE_HVG.txt
split_config: core_util_data/splits/tahoe/bio/tahoe_scaling_bio_split/entity_seed0/tahoe_scaling_bio_celln24921726_mhbss025_es0.yaml

tahoe:
  eval_cache_dir: eval_cache/normalization_raw_counts/geneset_c0d6420ffc0fa861__n_2000
  build_cache: true
  build_eval_cache: true
  build_noise_ceiling: true
parse:
  eval_cache_dir: eval_cache/normalization_raw_counts/geneset_63a547306aa0e6cd__n_2000
  build_cache: false

max_epochs: 32
hbss_equalize_training_budget: false
eval_callback_points: 1
seed: 64
limit_train_batches: null

use_curriculum: true
curriculum_mode: between_epochs
curriculum_target_product: 1792  # 7 conditions × 256 samples
between_epoch_curriculum_schedule:
  - {epoch: 0, n_repeats: 256, batch_size: 7, lr_mul: 1.0}
  - {epoch: 6, n_repeats: 256, batch_size: 7, lr_mul: 0.1}
  - {epoch: 13, n_repeats: 256, batch_size: 7, lr_mul: 0.01}

curriculum_n_repeats_start: 2
curriculum_n_repeats_step: 2
curriculum_lr_decay: 0.333333

n_repeats: 256
batch_size: 7

optimizer_type: adamw
lr: 0.0009
lr_init: 0.0
weight_decay: 0.0001
warmup_steps_min: 100
warmup_steps_max: 1000
grad_clip: 0

num_workers: 8
fetch_factor: 14
block_size: 1024
train_loader_mode: cell_set
group_by_condition: true
cell_set_budget_from_train_indices: true
use_cell_set: 256
cell_set_min_cells: 1

accumulate_grad_batches: 1
precision: bf16-mixed
compile_model: true
compile_mode: max-autotune
checkpoint_data_fraction: 1.0
devices: 1

backbone_type: condition_mlp
noise_distribution: uniform

condition_mlp_hidden_dims: [4096, 8192]
condition_mlp_tokdim: 256
condition_mlp_norm: none
condition_mlp_activation: gelu
condition_mlp_dropout: 0.0
condition_mlp_residual: false
condition_mlp_pre_norm: false

output_activation: relu
head_bias_init_from_train_mean: true
head_bias_init_n_batches: 100
apply_log1p: true
predict_delta: false
train_loss: rbf_kernel_score
rbf_bandwidth_median: 13.427872657775879

variogram_loss_weight: 0.0
variogram_p: 0.5
variogram_fast: true
variogram_debias: true
variogram_n_pairs: 6000
variogram_repeat_subsample: 256
variogram_batch_subsample: 896
variogram_balanced_zeros: false
variogram_mean_weight: false

total_log1p_mass_weight: 0.0

val_check_interval: 0.0
num_sanity_val_steps: 0
limit_val_batches: 0
use_early_stopping: false

use_eval_callback: true
eval_callback_every_n_epochs: 2
model_eval_splits:
  - validation

build_cache: true
build_eval_cache: true
build_noise_ceiling: true
noise_ceiling_strategy: split_half
noise_ceiling_n_repeats: 5
overwrite_noise_ceiling: false

run_model_eval_after_fit: true
plot_model_vs_ceiling_after_fit: false
model_eval_n_repeats: 3
save_split_coverage: true
raise_on_axis_coverage_failure: true

use_wandb: true
wandb_project: tahoe_bio_loss_ablation
wandb_entity: SCFM_VAL
wandb_run_name: null

log_every_n_steps: 50
log_train_reconstruction_metrics: false
log_grad_every_n_steps: 500
log_grad_top_k: 10
diagnostics: ["magnitudes"]
